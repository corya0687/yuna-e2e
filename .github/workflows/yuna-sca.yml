# Generated by `yuna init` (v0.1.0). Do not edit: change .yuna/config.yml
# (or the Yuna UI) and run `yuna init` again.
#
# Dependencies (SCA) + Licenses
# Protects against: Flags third-party packages with known vulnerabilities, the most common way small apps get breached. Warns about dependency licenses (for example AGPL) that could force you to publish your source code or block a sale.
# Expected time (medium mode): Dependencies (SCA) 15-35s, Licenses 20-55s.
# Gate: findings at high severity or above block the deploy.
#
# Yuna reports what its checks detect; it does not find every vulnerability and can be wrong. You remain responsible for your security and for every change you merge. Provided "as is", without warranty.
name: "Yuna: Dependencies (SCA) + Licenses"

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: yuna-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: "Dependencies (SCA)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache pinned scanners
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/yuna/tools
          key: yuna-tools-${{ runner.os }}-v0.1.0
      - name: Date for the vulnerability database cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnerability database (refreshed daily)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/trivy
          key: yuna-trivy-db-${{ runner.os }}-${{ steps.day.outputs.day }}
          restore-keys: yuna-trivy-db-${{ runner.os }}-
      - name: Install Yuna v0.1.0
        env:
          YUNA_VERSION: "v0.1.0"
          YUNA_SHA256: "90c52b37dbc2d7305ad6cb8f7861599fbf1d722a87b684c62cabfb8d5db97527"
        run: |
          set -euo pipefail
          url="https://github.com/corya0687/yuna/releases/download/${YUNA_VERSION}/yuna_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yuna" "$url"
          # The file runs only if it is byte-for-byte the released binary.
          echo "${YUNA_SHA256}  $RUNNER_TEMP/yuna" | sha256sum --check --strict -
          sudo install -m 0755 "$RUNNER_TEMP/yuna" /usr/local/bin/yuna
      - name: "Dependencies (SCA)"
        env:
          YUNA_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yuna scan sca
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuna-sca
          path: .yuna/results/
          if-no-files-found: ignore
          retention-days: 14
  license:
    name: "Licenses"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache pinned scanners
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/yuna/tools
          key: yuna-tools-${{ runner.os }}-v0.1.0
      - name: Date for the vulnerability database cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnerability database (refreshed daily)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/trivy
          key: yuna-trivy-db-${{ runner.os }}-${{ steps.day.outputs.day }}
          restore-keys: yuna-trivy-db-${{ runner.os }}-
      - name: Install Yuna v0.1.0
        env:
          YUNA_VERSION: "v0.1.0"
          YUNA_SHA256: "90c52b37dbc2d7305ad6cb8f7861599fbf1d722a87b684c62cabfb8d5db97527"
        run: |
          set -euo pipefail
          url="https://github.com/corya0687/yuna/releases/download/${YUNA_VERSION}/yuna_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yuna" "$url"
          # The file runs only if it is byte-for-byte the released binary.
          echo "${YUNA_SHA256}  $RUNNER_TEMP/yuna" | sha256sum --check --strict -
          sudo install -m 0755 "$RUNNER_TEMP/yuna" /usr/local/bin/yuna
      - name: "Licenses"
        env:
          YUNA_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yuna scan license
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuna-license
          path: .yuna/results/
          if-no-files-found: ignore
          retention-days: 14
