# Generated by `yuna init` (v0.1.0). Do not edit: change .yuna/config.yml
# (or the Yuna UI) and run `yuna init` again.
#
# Code scan (SAST)
# Protects against: Finds injection, unsafe deserialization, weak crypto, and other bugs in your own code before attackers do.
# Expected time (medium mode): Code scan (SAST) 40s-2m.
# Gate: findings at high severity or above block the deploy.
#
# Yuna reports what its checks detect; it does not find every vulnerability and can be wrong. You remain responsible for your security and for every change you merge. Provided "as is", without warranty.
name: "Yuna: Code scan (SAST)"

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuna-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: "Code scan (SAST)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go (for gosec)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache pinned scanners
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/yuna/tools
          key: yuna-tools-${{ runner.os }}-v0.1.0
      - name: Install Yuna v0.1.0
        env:
          YUNA_VERSION: "v0.1.0"
          YUNA_SHA256: "90c52b37dbc2d7305ad6cb8f7861599fbf1d722a87b684c62cabfb8d5db97527"
        run: |
          set -euo pipefail
          url="https://github.com/corya0687/yuna/releases/download/${YUNA_VERSION}/yuna_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yuna" "$url"
          # The file runs only if it is byte-for-byte the released binary.
          echo "${YUNA_SHA256}  $RUNNER_TEMP/yuna" | sha256sum --check --strict -
          sudo install -m 0755 "$RUNNER_TEMP/yuna" /usr/local/bin/yuna
      - name: "Code scan (SAST)"
        env:
          YUNA_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yuna scan sast
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuna-sast
          path: .yuna/results/
          if-no-files-found: ignore
          retention-days: 14
